name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: アプリ名
        default: DataUsage
      package_name:
        description: パッケージ名（英小文字・数字・ドット）
        default: app.hatent.datausage
  push:
permissions:
  contents: write
jobs:
