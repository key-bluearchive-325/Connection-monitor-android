          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DataUsage"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.datausage"
              compileSdk = 34
              defaultConfig {
                  applicationId = "PKG_HERE"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "1.3"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          sed -i "s/PKG_HERE/$PKG/" app/build.gradle.kts
          cat > $D/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">$APP_NAME</string>
              <string name="name2">通信モニター</string>
              <string name="name3">Data Ring</string>
              <string name="name4">Bolt</string>
          </resources>
          EOF
          i=0
          { echo "<resources>"
            for c in 5B6CFF 0EA5A4 7C3AED F59E0B; do i=$((i+1)); echo "<color name=\"bg$i\">#$c</color>"; done
            echo "</resources>"; } > $D/res/values/colors.xml
